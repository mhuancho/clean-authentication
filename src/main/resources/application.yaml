spring:
  application:
    name: clean-authentication
  security:
    oauth2:
      client:
        registration:
          github:
            client-id: CLIENTE_ID_GITHUB
            client-secret: CLIENTE_SECRET_GITHUB
            scope: read:user,user:email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
          google:
            client-id: CLIENTE_ID_GOOGLE
            client-secret: CLIENTE_SECRET_GOOGLE
            scope:
              - openid
              - profile
              - email
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          google:
            authorization-uri: https://accounts.google.com/o/oauth2/v2/auth
            token-uri: https://oauth2.googleapis.com/token
            user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo
            user-name-attribute: sub
          github:
            authorization-uri: https://github.com/login/oauth/authorize
            token-uri: https://github.com/login/oauth/access_token
            user-info-uri: https://api.github.com/user
            user-name-attribute: login

  main:
    allow-bean-definition-overriding: true
server:
    port: 4509

app:
  oauth2:
    failure-redirect-url: http://localhost:4200/auth/error
    success-redirect-url: http://localhost:4200/auth/success
    login-redirect-url: http://localhost:4200/login
    init-redirect-url: http://localhost:4200